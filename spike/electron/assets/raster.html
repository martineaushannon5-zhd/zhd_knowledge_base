<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}img{display:block}</style></head>
<body><img id="icon" src="./icon.svg" alt=""></body>
<script>
  const size = parseInt(new URLSearchParams(location.search).get('size') || '512', 10);
  const img = document.getElementById('icon');
  img.width = size; img.height = size;
</script>
</html>
